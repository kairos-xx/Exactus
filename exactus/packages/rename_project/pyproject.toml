[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rename-project"
version = "0.1.0"
description = "Rename a project: root directory, files, and its name inside text, restyled per casing convention."
readme = "README_RENAME_PROJECT.md"
requires-python = ">=3.13"
dependencies = [
  "defusedxml>=0.7",
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=1.19",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.31",
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
rename-project = "rename_project:main"

[tool.setuptools]
py-modules = ["rename_project", "cli_help"]

[tool.ruff]
target-version = "py313"
line-length = 79
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["rename_project.py", "cli_help.py"]
extraPaths = ["."]
