<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CSS Cause Demo</title>
  </head>
  <body>
    <main class="demo">
      <p class="eyebrow">VISUAL CAUSE</p>
      <h1>Four intentional CSS changes</h1>
      <p class="intro">
        A deliberately small example for inspecting causal evidence.
      </p>
      <section class="cards">
        <article class="card primary">
          <h2>Primary card</h2>
          <p>Its background and padding change.</p>
        </article>
        <article class="card secondary">
          <h2>Secondary card</h2>
          <p>Its border radius changes.</p>
        </article>
      </section>
      <button class="action" type="button">Run analysis</button>
    </main>
  </body>
</html>
