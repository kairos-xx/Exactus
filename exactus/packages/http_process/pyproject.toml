[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "http-process"
version = "0.1.0"
description = "Run processes and inspect HTTP listeners and local process ownership."
requires-python = ">=3.13"
dependencies = ["psutil>=7.0"]

[project.scripts]
http-process = "http_process.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["http_process*"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
