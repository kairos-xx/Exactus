<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JavaScript Runner Widget</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="module" src="code.js"></script>
  </head>
  <body>
    <a class="demo-skip" href="#demo">Skip to the demo</a>
    <main id="demo" class="demo">
      <header class="demo-head">
        <h1 class="demo-title">JavaScript runner widget</h1>
        <p class="demo-note">
          Edit the snippet and press Run, or use Ctrl+Enter.
        </p>
      </header>
      <section class="demo-actions" aria-label="Sample snippets">
        <button class="demo-button" type="button" data-sample="variables">
          Variables
        </button>
        <button class="demo-button" type="button" data-sample="expression">
          Expression
        </button>
        <button class="demo-button" type="button" data-sample="async">
          Async
        </button>
        <button class="demo-button" type="button" data-sample="error">
          Error
        </button>
        <button class="demo-button" type="button" data-sample="assert">
          Assertion
        </button>
        <button class="demo-button" type="button" data-sample="loop">
          Endless loop
        </button>
        <button
          class="demo-button"
          type="button"
          data-width="compact"
          aria-pressed="true"
        >
          Compact
        </button>
        <button
          class="demo-button"
          type="button"
          data-width="wide"
          aria-pressed="false"
        >
          Wide
        </button>
      </section>
      <section class="demo-stage" aria-label="Runner preview">
        <div class="demo-host" data-component="runner-host" data-size="compact">
          <textarea name="payload" data-component="snippet" hidden></textarea>
        </div>
      </section>
      <p class="demo-note" role="status" data-component="saved">
        Nothing saved yet.
      </p>
    </main>
  </body>
</html>
